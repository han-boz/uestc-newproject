# =============================================
# 本地开发环境 - 无需 MySQL/Redis 即可运行
# 启动方式: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
# =============================================

server:
  port: 8888

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/health_portal;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_RECONNECT=TRUE
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: always
      schema-locations: classpath:sql/init.sql
      continue-on-error: true

  # Redis 已被 spring.autoconfigure.exclude 排除

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: aGVhbHRoLWlubm92YS1wb3J0YWwtc2VjcmV0LWtleS1mb3Itand0LXRva2VuLWdlbmVyYXRpb24=
  expiration: 86400
  header: Authorization
  token-prefix: "Bearer "

file:
  upload:
    path: uploads/

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
