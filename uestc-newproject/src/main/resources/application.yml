server:
  port: 8888
  servlet:
    context-path: /

spring:
  profiles:
    active: local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 060414
    url: jdbc:mysql://localhost:3306/health_portal?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai

  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      database: 1
      timeout: 1800000
      lettuce:
        pool:
          max-active: 20
          max-wait: -1
          max-idle: 5
          min-idle: 1

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# SpringDoc + Swagger3
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.healthinnova.portal.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT
jwt:
  secret: aGVhbHRoLWlubm92YS1wb3J0YWwtc2VjcmV0LWtleS1mb3Itand0LXRva2VuLWdlbmVyYXRpb24=
  expiration: 86400
  header: Authorization
  token-prefix: "Bearer "

# 文件上传
file:
  upload:
    path: uploads/
