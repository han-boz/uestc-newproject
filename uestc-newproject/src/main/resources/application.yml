# =============================================
# 健康大数据应用创新研发中心 - 门户系统
#
# [默认] 使用 MySQL + Redis（profile = mysql）
#   → 每名组员需修改本项目数据库密码为本地配置
#   → 无 MySQL/Redis 的组员改用 local 模式启动
#   → IDEA: 修改 Active Profiles 为 "local"
#   → 命令行: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
#
# [备用] H2 嵌入式数据库，无需任何外部服务（profile = local）
#   → 所有组员都能零配置直接运行
# =============================================

server:
  port: 8888
  servlet:
    context-path: /

spring:
  profiles:
    active: mysql

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:060414}
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/health_portal?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:123456}
      database: 1
      timeout: 1800000
      lettuce:
        pool:
          max-active: 20
          max-wait: -1
          max-idle: 5
          min-idle: 1

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# SpringDoc + Swagger3
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true

# MyBatis-Plus（全部使用注解，无需 XML mapper）
mybatis-plus:
  type-aliases-package: com.healthinnova.portal.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT
jwt:
  secret: aGVhbHRoLWlubm92YS1wb3J0YWwtc2VjcmV0LWtleS1mb3Itand0LXRva2VuLWdlbmVyYXRpb24=
  expiration: 86400
  header: Authorization
  token-prefix: "Bearer "

# 文件上传
file:
  upload:
    path: uploads/
