spring:
  profiles:
    active: test

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:test_health_portal;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:

  h2:
    console:
      enabled: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  sql:
    init:
      mode: always
      schema-locations: classpath:sql/test-init.sql
      continue-on-error: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: aGVhbHRoLWlubm92YS1wb3J0YWwtc2VjcmV0LWtleS1mb3Itand0LXRva2VuLWdlbmVyYXRpb24=
  expiration: 86400
  header: Authorization
  token-prefix: "Bearer "

file:
  upload:
    path: uploads/

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
